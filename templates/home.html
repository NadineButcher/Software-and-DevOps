<!-- templates/home.html -->>
{% extends "base.html" %}

{% block title %}Home{% endblock title %}

{% block content %}
{% if user.is_authenticated %}
    {{ user.username }}

    <p>
        <a class="btn btn-primary btn-lg" href="{% url 'task_list' %}" role="button">
            View all Tasks
        </a>
    </p>

{% else %}

    <p>You are not logged in</p>
    <a href="{% url 'login' %}">Log In</a> |
    <a href="{% url 'signup' %}">Sign Up</a>

{% endif %}
{% endblock content %}
