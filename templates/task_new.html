<!-- templates/task_new.html -->

{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}New Task{% endblock title %}

{% block extra_head %}
    {{ form.media }}
{% endblock extra_head %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">New Task</h1>

    <a href="{% url 'home' %}" class="btn btn-secondary mb-3">
        Back
    </a>

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn btn-success mt-3">
            Save
        </button>
    </form>

</div>

{% endblock content %}
