{% extends "base.html" %}
{% load static %}

{% block title %}Register Passkey{% endblock title %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-3">Register a Passkey</h2>

            <p class="text-muted">
                Add a passkey to your account so you can sign in
                using your device, fingerprint, face recognition,
                PIN, or security key.
            </p>

            <button
                type="button"
                id="register-passkey-button"
                class="btn btn-primary w-100 mt-3"
            >
                Register Passkey
            </button>

            <div id="passkey-status" class="mt-3"></div>

            <p class="mt-4">
                <a href="{% url 'home' %}">Return to home</a>
            </p>

        </div>
    </div>
</div>

<script src="{% static 'passkeys/passkeys.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const button =
        document.getElementById("register-passkey-button");

    const status =
        document.getElementById("passkey-status");

    button.addEventListener("click", async function () {

        button.disabled = true;
        status.innerHTML =
            '<div class="alert alert-info">Starting passkey registration...</div>';

        try {

            await window.startRegistration(
                "{% url 'passkeys:register_start' %}",
                "{% url 'passkeys:register_finish' %}",
                "{{ csrf_token }}"
            );

            status.innerHTML =
                '<div class="alert alert-success">' +
                'Passkey registered successfully.' +
                '</div>';

        } catch (error) {

            console.error(
                "Passkey registration failed:",
                error
            );

            status.innerHTML =
                '<div class="alert alert-danger">' +
                'Passkey registration failed: ' +
                (error.message || error) +
                '</div>';

        } finally {

            button.disabled = false;
        }
    });

});
</script>

{% endblock content %}
