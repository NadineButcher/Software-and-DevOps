{% extends "base.html" %}
{% load static %}

{% block title %}Register Passkey{% endblock title %}

{% block content %}

<meta name="csrf-token" content="{{ csrf_token }}">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-3">Register a Passkey</h2>

            <p class="text-muted">
                Add a passkey to your account so you can sign in
                using your device, fingerprint, face recognition,
                PIN, or security key.
            </p>

            <button
                type="button"
                id="register-passkey-button"
                class="btn btn-primary w-100 mt-3"
            >
                Register Passkey
            </button>

            <div id="passkey-status" class="mt-3"></div>

            <p class="mt-4">
                <a href="{% url 'home' %}">Return to home</a>
            </p>

        </div>
    </div>
</div>

<script src="{% static 'passkeys/passkey.js' %}"></script>

<script>
document
    .getElementById("register-passkey-button")
    .addEventListener("click", function () {

        const csrfToken =
            document.querySelector(
                'meta[name="csrf-token"]'
            ).content;

        startRegistration(
            "{% url 'passkeys:register_start' %}",
            "{% url 'passkeys:register_finish' %}",
            csrfToken
        );
    });
</script>

{% endblock content %}
